<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080,height=1350">
<title>Spieltag Aktuell Instagram API Test</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Roboto:wght@400;500;700&display=swap');
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1350px;overflow:hidden;background:#F2AFC0;color:#000}
body{font-family:Roboto,Arial,sans-serif}.post{width:1080px;height:1350px;padding:76px 82px 64px;display:flex;flex-direction:column}
.logo{width:380px;height:auto;display:block;margin:0 auto}.middle{flex:1;display:flex;flex-direction:column;justify-content:center;padding-top:20px}
.title{font-family:'Archivo Black','Arial Black',sans-serif;font-size:96px;line-height:.94;letter-spacing:-4px;text-transform:uppercase;margin:0 0 32px}
.date{align-self:flex-start;background:#000;color:#F2AFC0;border-radius:999px;font-family:'Archivo Black','Arial Black',sans-serif;font-size:30px;line-height:1;padding:15px 25px 17px;margin-bottom:42px}
.match{display:grid;grid-template-columns:145px 1fr;gap:24px;padding:29px 0 30px;border-bottom:3px solid #000}.match.first{border-top:3px solid #000}
.time{font-family:'Archivo Black','Arial Black',sans-serif;font-size:42px;line-height:1.05}.teams{font-family:'Archivo Black','Arial Black',sans-serif;font-size:40px;line-height:1.04;letter-spacing:-1.2px}
.sender{font-size:25px;font-weight:500;margin-top:10px}.footer{text-align:center;font-family:'Archivo Black','Arial Black',sans-serif;font-size:26px;letter-spacing:.5px;padding-top:34px}
</style>
</head>
<body>
<main class="post">
<img class="logo" src="../../logo.svg" alt="Spieltag Aktuell">
<section class="middle">
<h1 class="title">FUSSBALL-<br>HIGHLIGHTS<br>HEUTE</h1>
<div class="date">30. SEPTEMBER 2026</div>
<div class="match first"><div class="time">18:00</div><div><div class="teams">MALTA U21 –<br>DEUTSCHLAND U21</div><div class="sender">ProSieben MAXX · Joyn</div></div></div>
<div class="match"><div class="time">19:30</div><div><div class="teams">VER. ARABISCHE EMIRATE – KATAR</div><div class="sender">Sportdigital Fussball</div></div></div>
</section>
<footer class="footer">SPIELTAGAKTUELL.DE</footer>
</main>
</body></html>
