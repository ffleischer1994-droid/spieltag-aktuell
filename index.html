<style>
:root{--pink:#F2AFC0;--black:#000;--r:16px}*{box-sizing:border-box}body{margin:0;background:var(--pink);color:var(--black);font-family:Roboto,Arial,sans-serif}.wrap{max-width:1120px;margin:auto;padding:0 22px 72px}header{border-bottom:1px solid #000}.header-inner{max-width:1120px;margin:auto;padding:20px 22px;display:flex;justify-content:center}.logo{width:220px}.day-nav{margin:28px 0 16px;display:grid;grid-template-columns:48px 1fr 48px;gap:10px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.arrow,.day,.chip,select,.filters,.time-block,.empty-state{border:1px solid #000}.arrow,.day,.chip,select{background:var(--pink);color:#000}.arrow{height:64px;border-radius:var(--r);font-size:25px;font-weight:900}.day{border-radius:var(--r);padding:11px 8px;text-align:center}.day .dow{display:block;font-size:13px;font-weight:900;text-transform:uppercase}.day .date{display:block;font-family:"Archivo Black";font-size:26px;margin-top:3px}.day.active,.chip.active{background:#000;color:var(--pink)}.day.active .dow{color:var(--pink)}.filters{border-radius:18px;padding:15px;margin-bottom:22px}.filter-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.filter-title,.list-head h2,.time,.teams,.time-block summary strong{font-family:"Archivo Black"}.filter-title{font-size:15px;text-transform:uppercase}.reset{border:0;background:none;text-decoration:underline;font-weight:800}.filter-grid{display:grid;grid-template-columns:1.55fr .9fr .9fr;gap:12px}.channels{display:flex;gap:8px;flex-wrap:wrap}.chip{border-radius:999px;padding:12px 18px;font-size:15px;font-weight:900}.select-wrap label{display:block;margin:0 0 5px 2px;font-size:12px;font-weight:900;text-transform:uppercase}.select-wrap select{width:100%;height:48px;border-radius:999px;padding:0 16px;font-weight:700}.list-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.list-head h2{font-size:22px;text-transform:uppercase;margin:0}.count{font-size:14px;font-weight:900;text-transform:uppercase}.time-block{border-radius:18px;overflow:hidden;margin-bottom:12px}.time-block summary{list-style:none;cursor:pointer;padding:17px 18px;display:flex;justify-content:space-between;align-items:center}.time-block summary::-webkit-details-marker{display:none}.time-block[open] summary{background:#000;color:var(--pink)}.summary-left{display:flex;align-items:center;gap:14px}.summary-copy{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.summary-copy span{font-size:17px}.toggle-sign{width:38px;height:38px;display:grid;place-items:center;border:1px solid #000;border-radius:999px;background:var(--pink);color:#000;font-size:28px;font-weight:900}.toggle-sign:before{content:"+"}details[open] .toggle-sign:before{content:"−"}.visible-count{display:grid;place-items:center;min-width:34px;height:34px;padding:0 9px;border-radius:999px;border:1px solid currentColor;font-size:13px;font-weight:900}.matches{border-top:1px solid #000}.match{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:17px;align-items:center;padding:18px 16px;border-top:1px solid #000}.match:first-child{border-top:0}.time{font-size:28px}.teams{font-size:22px}.meta{margin-top:4px;font-size:13px;font-weight:700;text-transform:uppercase}.providers{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}.badge{border:1px solid #000;border-radius:999px;padding:7px 10px;font-size:13px;font-weight:900;color:#000;text-decoration:none;display:inline-flex;align-items:center;gap:5px}.badge:hover{background:#000;color:var(--pink)}.badge.free{background:#000;color:var(--pink)}.badge.free:hover{background:var(--pink);color:#000}.badge .ext{font-size:11px;line-height:1}.empty-state{border-radius:18px;padding:26px 18px;font-family:"Archivo Black";font-size:24px}.footer-note{padding-top:12px;font-size:14px;font-weight:700}@media(max-width:850px){.days{grid-template-columns:repeat(5,1fr)}.day:nth-child(1),.day:nth-child(7){display:none}.filter-grid{grid-template-columns:1fr}.match{grid-template-columns:72px 1fr}.providers{grid-column:2;justify-content:flex-start}}@media(max-width:560px){.wrap{padding-inline:12px}.logo{width:180px}.day-nav{grid-template-columns:40px 1fr 40px}.days{grid-template-columns:repeat(3,1fr)}.day:nth-child(2),.day:nth-child(6){display:none}.match{grid-template-columns:60px 1fr;gap:10px;padding:14px 12px}.time{font-size:24px}.teams{font-size:19px}}

<body>
<header><div class="header-inner"><img class="logo" src="logo.svg" alt="Spieltag Aktuell"></div></header>
<main class="wrap">
<nav class="day-nav"><button class="arrow" id="prev-day">‹</button><div class="days" id="days"></div><button class="arrow" id="next-day">›</button></nav>
<section class="filters">
<div class="filter-top"><div class="filter-title">Filtern</div><button class="reset" id="reset">Alles zurücksetzen</button></div>
<div class="filter-grid">
<div class="channels"><button class="chip active" data-filter="all">Alle Sender</button><button class="chip" data-filter="free">Free-TV</button><button class="chip" data-filter="dazn">DAZN</button><button class="chip" data-filter="sky">Sky / WOW</button><button class="chip" data-filter="prime">Prime</button><button class="chip" data-filter="other">Weitere</button></div>
<div class="select-wrap"><label>Land</label><select id="country-filter"><option value="all">Alle Länder</option></select></div>
<div class="select-wrap"><label>Wettbewerb</label><select id="competition-filter"><option value="all">Alle Wettbewerbe</option></select></div>
</div></section>
<div class="list-head"><h2 id="selected-date-label"></h2><div class="count" id="count"></div></div>
<div id="game-list"></div>
<nav style="border-top:1px solid #000;margin-top:28px;padding-top:18px;display:flex;gap:16px;flex-wrap:wrap;font-weight:900">
<a href="/fussball-heute/" style="color:#000">Fußball heute</a>
<a href="/frauenfussball/" style="color:#000">Frauenfußball</a>
<a href="/dazn/" style="color:#000">DAZN Fußball</a>
<a href="/free-tv/" style="color:#000">Free-TV Fußball</a>
<a href="/sky-wow/" style="color:#000">Sky / WOW</a>
<a href="/champions-league/" style="color:#000">Champions League</a>
<a href="/bundesliga/" style="color:#000">Bundesliga</a>
</nav>
<div class="footer-note">Spieltag Aktuell · Fußball im TV & Stream</div>
<nav style="border-top:1px solid #000;margin-top:28px;padding-top:18px;display:flex;gap:16px;flex-wrap:wrap;font-weight:900">
<a href="/ueber/" style="color:#000">Über Spieltag Aktuell</a>
<a href="/datenquellen/" style="color:#000">Daten & Recherche</a>
<a href="/impressum/" style="color:#000">Impressum</a>
<a href="/datenschutz/" style="color:#000">Datenschutz</a>
</nav>
</main>
<script>
let GAMES=[];let senderFilter="all",countryFilter="all",competitionFilter="all";
const weekdaysShort=["So","Mo","Di","Mi","Do","Fr","Sa"],weekdaysLong=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
function localISO(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
const today=new Date();today.setHours(12,0,0,0);const DAY_DATES=Array.from({length:7},(_,i)=>{const d=new Date(today);d.setDate(d.getDate()+i);return localISO(d)});let selectedDate=DAY_DATES[0];
function fmt(s){const d=new Date(s+"T12:00:00");return{short:d.getDate()+"."+(d.getMonth()+1)+".",dow:weekdaysShort[d.getDay()],long:weekdaysLong[d.getDay()]+", "+String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."}}
function renderDays(){days.innerHTML=DAY_DATES.map(ds=>{const p=fmt(ds);return '<button class="day '+(ds===selectedDate?'active':'')+'" data-date="'+ds+'"><span class="dow">'+(ds===DAY_DATES[0]?'Heute':p.dow)+'</span><span class="date">'+p.short+'</span></button>'}).join("");days.querySelectorAll(".day").forEach(b=>b.onclick=()=>{selectedDate=b.dataset.date;renderAll()})}
function visible(){return GAMES.filter(g=>g.date===selectedDate&&(senderFilter==="all"||g.groups.includes(senderFilter))&&(countryFilter==="all"||g.country===countryFilter)&&(competitionFilter==="all"||g.competition===competitionFilter)).sort((a,b)=>a.time.localeCompare(b.time))}
function period(t){const[h,m]=t.split(":").map(Number),v=h*60+m;return v<720?"morning":v<1020?"afternoon":"evening"}
function selects(){const day=GAMES.filter(g=>g.date===selectedDate),cs=[...new Set(day.map(g=>g.country))].sort(),ws=[...new Set(day.map(g=>g.competition))].sort();countryFilter=cs.includes(countryFilter)?countryFilter:"all";competitionFilter=ws.includes(competitionFilter)?competitionFilter:"all";document.getElementById("country-filter").innerHTML='<option value="all">Alle Länder</option>'+cs.map(x=>'<option>'+x+'</option>').join("");document.getElementById("competition-filter").innerHTML='<option value="all">Alle Wettbewerbe</option>'+ws.map(x=>'<option>'+x+'</option>').join("");document.getElementById("country-filter").value=countryFilter;document.getElementById("competition-filter").value=competitionFilter}
const PROVIDER_URLS=[
  [/^DAZN/i,"https://www.dazn.com/de-DE/home"],
  [/^Sky/i,"https://www.sky.de/sport"],
  [/^WOW/i,"https://www.wowtv.de/"],
  [/^Prime/i,"https://www.amazon.de/gp/video/storefront"],
  [/^(RTL|RTL\+)/i,"https://plus.rtl.de/"],
  [/^ZDF/i,"https://www.zdf.de/live-tv"],
  [/^(Das Erste|ARD)/i,"https://www.ardmediathek.de/live"],
  [/^(BR|BR24)/i,"https://www.ardmediathek.de/br"],
  [/^(ProSieben MAXX|Joyn)/i,"https://www.joyn.de/live-tv"],
  [/^MagentaSport/i,"https://www.magentasport.de/"],
  [/^OneFootball/i,"https://onefootball.com/de/home"],
  [/^Sportdigital/i,"https://start.sportdigital.de/"],
  [/^Disney\+/i,"https://www.disneyplus.com/de-de"],
  [/^FIFA\+/i,"https://www.plus.fifa.com/"],
  [/^DFB\.TV/i,"https://tv.dfb.de/"],
  [/^YouTube/i,"https://www.youtube.com/"]
];
function providerUrl(name){const hit=PROVIDER_URLS.find(([rx])=>rx.test(name));return hit?hit[1]:null}
function providerBadge(c,g){
  const direct=g.channelLinks&&g.channelLinks[c]?g.channelLinks[c]:null;
  const url=direct||providerUrl(c),free=g.groups.includes("free");
  if(url)return '<a class="badge '+(free?'free':'')+'" href="'+url+'" target="_blank" rel="noopener noreferrer" title="'+(direct?c+' – direkt zum Spiel/Stream':c+' – Anbieter öffnen')+'">'+c+'<span class="ext">↗</span></a>';
  return '<span class="badge '+(free?'free':'')+'">'+c+'</span>'
}
function match(g){return '<article class="match"><div class="time">'+g.time+'</div><div><div class="teams">'+g.home+' – '+g.away+'</div><div class="meta">'+g.competition+' · '+g.country+'</div></div><div class="providers">'+g.channels.map(c=>providerBadge(c,g)).join("")+'</div></article>'}
function block(key,title,range,arr,open){return '<details class="time-block" '+(open?'open':'')+'><summary><div class="summary-left"><span class="toggle-sign"></span><div class="summary-copy"><strong>'+title+'</strong><span>'+range+'</span></div></div><b class="visible-count">'+arr.length+'</b></summary><div class="matches">'+arr.map(match).join("")+'</div></details>'}
function renderGames(){const a=visible(),g={morning:a.filter(x=>period(x.time)==="morning"),afternoon:a.filter(x=>period(x.time)==="afternoon"),evening:a.filter(x=>period(x.time)==="evening")};let out="";if(g.morning.length)out+=block("morning","Morgens","00:00–12:00",g.morning,false);if(g.afternoon.length)out+=block("afternoon","Mittags","12:00–17:00",g.afternoon,true);if(g.evening.length)out+=block("evening","Abends","17:00–24:00",g.evening,true);if(!a.length)out='<div class="empty-state">Für diesen Tag bzw. diese Filter sind noch keine Spiele geladen.</div>';document.getElementById("game-list").innerHTML=out;document.getElementById("count").textContent=a.length+" "+(a.length===1?"Spiel":"Spiele");document.getElementById("selected-date-label").textContent=fmt(selectedDate).long}
function renderAll(){renderDays();selects();renderGames()}
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));c.classList.add("active");senderFilter=c.dataset.filter;renderGames()});
document.getElementById("country-filter").onchange=e=>{countryFilter=e.target.value;renderGames()};document.getElementById("competition-filter").onchange=e=>{competitionFilter=e.target.value;renderGames()};
document.getElementById("reset").onclick=()=>{senderFilter=countryFilter=competitionFilter="all";document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("active",x.dataset.filter==="all"));selects();renderGames()};
document.getElementById("prev-day").onclick=()=>{let i=DAY_DATES.indexOf(selectedDate);if(i>0){selectedDate=DAY_DATES[i-1];renderAll()}};
document.getElementById("next-day").onclick=()=>{let i=DAY_DATES.indexOf(selectedDate);if(i<DAY_DATES.length-1){selectedDate=DAY_DATES[i+1];renderAll()}};
fetch("games.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{GAMES=d;renderAll()}).catch(()=>{renderAll();document.getElementById("game-list").innerHTML='<div class="empty-state">Spieldaten konnten gerade nicht geladen werden.</div>'});
</script>
</body></html>
