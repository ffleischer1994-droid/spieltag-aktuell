<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DFB-Pokal im TV & Stream | Spieltag Aktuell</title><meta name="description" content="DFB-Pokal im TV & Stream: aktuelle Spiele, Anstoßzeiten und bestätigte Übertragungsinformationen."><meta name="robots" content="noindex,follow"><link rel="canonical" href="https://spieltagaktuell.de/dfb-pokal/"><link rel="icon" href="/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#F2AFC0;color:#000;font-family:Roboto,Arial}header{position:sticky;top:0;z-index:10;background:#F2AFC0;border-bottom:2px solid #000;text-align:center;padding:16px}header img{width:220px}.wrap{max-width:950px;margin:auto;padding:34px 18px 70px}h1{font:clamp(38px,7vw,68px)/.98 "Archivo Black";margin:14px 0 20px}.lead{font-size:19px;font-weight:700;max-width:760px;line-height:1.45}.game,.empty{border:2px solid #000;border-radius:20px;padding:20px;margin:14px 0}.game{display:grid;grid-template-columns:125px 1fr;gap:18px}.when,.teams{font-weight:900}.teams{font-family:"Archivo Black";font-size:22px}.meta{font-size:14px;font-weight:700;margin-top:7px}.links{display:flex;gap:16px;flex-wrap:wrap;border-top:2px solid #000;margin-top:32px;padding-top:20px}a{color:#000;font-weight:900}@media(max-width:560px){header img{width:190px}.game{grid-template-columns:82px 1fr;gap:12px}.teams{font-size:18px}}</style></head><body><header><a href="/"><img src="/logo.svg" alt="Spieltag Aktuell"></a></header><main class="wrap"><a href="/">Spieltag Aktuell</a><h1>DFB-Pokal im TV & Stream</h1><p class="lead">Aktuelle DFB-Pokal-Spiele mit Anstoßzeit sowie TV- und Streamingangaben. Anbieter zeigen wir nur, wenn sie in unseren aktuellen Daten erfasst sind.</p><div id="games">Spiele werden geladen …</div><nav class="links"><a href="/fussball-heute/">Fußball heute</a><a href="/free-tv/">Fußball im Free-TV</a><a href="/">Alle Spiele</a></nav></main><script>const KEY="DFB-Pokal";fetch("/games.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{const today=new Date().toLocaleDateString("sv-SE",{timeZone:"Europe/Berlin"});const a=d.filter(g=>g.date>=today&&g.competition.toLowerCase().includes(KEY.toLowerCase())).sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));document.getElementById("games").innerHTML=a.length?a.map(g=>'<article class="game"><div class="when">'+g.date.split("-").reverse().join(".")+'<br>'+g.time+' Uhr</div><div><div class="teams">'+g.home+' – '+g.away+'</div><div class="meta">'+g.channels.join(" · ")+'</div></div></article>').join(""):'<div class="empty">Aktuell ist in unserem Datenfenster kein kommendes DFB-Pokal-Spiel eingetragen. Sobald belastbare Termine vorliegen, erscheint die Partie hier.</div>'}).catch(()=>document.getElementById("games").innerHTML='<div class="empty">Die Spieldaten konnten gerade nicht geladen werden.</div>')</script></body></html>
