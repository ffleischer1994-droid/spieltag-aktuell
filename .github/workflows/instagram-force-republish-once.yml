name: Instagram Force Republish Once

on:
  push:
    paths:
      - '.github/workflows/instagram-force-republish-once.yml'

permissions:
  contents: read

jobs:
  republish:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build today's social package
        run: node scripts/social/build-social.mjs

      - name: Install renderer
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Render today's feed and story
        run: node scripts/social/render-social.mjs

      - name: Force fresh publish without touching production receipts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_PUBLISH_MODE: both
          IG_ASSET_SHA: ${{ github.sha }}
        run: |
          DATE=$(TZ=Europe/Berlin date +%Y-%m-%d)
          rm -f "social/published/${DATE}.json"
          node scripts/social/publish-instagram.mjs
