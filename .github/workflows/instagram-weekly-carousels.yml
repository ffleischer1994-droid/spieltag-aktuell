name: Instagram Weekly Carousels
on:
  schedule:
    - cron: "0,20,40 15-17 * * 1"
    - cron: "0,20,40 10-11 * * 1"
    # Avoid GitHub Actions top-of-hour congestion and retry into the evening.
    - cron: "7,27,47 13-20 * * 5"
  # Backup trigger: a successful broadcast-data refresh can rescue a delayed or dropped cron run.
  workflow_run:
    workflows: ["Refresh and publish broadcast data"]
    types: [completed]
  workflow_dispatch:
    inputs:
      format:
        type: choice
        required: true
        options: [free-tv, weekend, women]
      dry_run:
        type: boolean
        default: true
      corrected_free_tv_repost:
        description: "Einmalige korrigierte Free-TV-Veröffentlichung (nur 12.10.2026)"
        type: boolean
        default: false
      full_week_final_repost:
        description: "Finaler Free-TV-Post Mo–So (nur 12.10.2026)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: instagram-weekly-carousels
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Berlin
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: git pull --ff-only origin main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Determine local format and check receipt
        env:
          MANUAL_FORMAT: ${{ inputs.format }}
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}
          MANUAL_REPOST: ${{ inputs.corrected_free_tv_repost }}
          MANUAL_FINAL: ${{ inputs.full_week_final_repost }}
          UPSTREAM_RESULT: ${{ github.event.workflow_run.conclusion }}
        run: |
          DAY=$(TZ=Europe/Berlin date +%u)
          HOUR=$(TZ=Europe/Berlin date +%H)
          DATE=$(TZ=Europe/Berlin date +%F)
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ] && { [ "$DAY" != "5" ] || [ "$UPSTREAM_RESULT" != "success" ]; }; then
            echo "::notice::Backup trigger skipped: not Friday or upstream data refresh failed"
            echo "SKIP_WEEKLY=1" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            FORMAT="$MANUAL_FORMAT"
            if [ "$MANUAL_DRY_RUN" = "true" ]; then echo "WEEKLY_DRY_RUN=1" >> "$GITHUB_ENV"; fi
          elif [ "$DAY" = "1" ] && [ "$HOUR" -ge 12 ] && [ "$HOUR" -lt 14 ]; then FORMAT="women"
          elif [ "$DAY" = "1" ] && [ "$HOUR" -ge 17 ] && [ "$HOUR" -lt 19 ]; then FORMAT="free-tv"
          elif [ "$DAY" = "5" ] && [ "$HOUR" -ge 15 ] && [ "$HOUR" -lt 22 ]; then FORMAT="weekend"
          else echo "::notice::Outside scheduled publication window (Berlin: $DATE $HOUR:00)"; echo "SKIP_WEEKLY=1" >> "$GITHUB_ENV"; exit 0; fi
          if [ "$MANUAL_REPOST" = "true" ] && [ "$MANUAL_FINAL" = "true" ]; then echo "::error::Choose only one repost type"; exit 1; fi
          if [ "$MANUAL_FINAL" = "true" ]; then
            if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] || [ "$FORMAT" != "free-tv" ] || [ "$DATE" != "2026-10-12" ] || [ "$MANUAL_DRY_RUN" = "true" ]; then
              echo "::error::Final repost only permitted for public Free-TV on 2026-10-12"; exit 1
            fi
            echo "WEEKLY_FINAL_REPOST=1" >> "$GITHUB_ENV"
            echo "WEEKLY_ASSET_SUFFIX=-full-week" >> "$GITHUB_ENV"
          fi
          if [ "$MANUAL_REPOST" = "true" ]; then
            if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] || [ "$FORMAT" != "free-tv" ] || [ "$DATE" != "2026-10-12" ] || [ "$MANUAL_DRY_RUN" = "true" ]; then
              echo "::error::Corrected repost only allowed for public Free-TV on 2026-10-12"; exit 1
            fi
            echo "WEEKLY_REPOST=1" >> "$GITHUB_ENV"
            echo "WEEKLY_ASSET_SUFFIX=-corrected" >> "$GITHUB_ENV"
          fi
          echo "WEEKLY_FORMAT=$FORMAT" >> "$GITHUB_ENV"
          RECEIPT="social/published/$FORMAT-$DATE.json"
          if [ "$MANUAL_REPOST" = "true" ]; then RECEIPT="social/published/$FORMAT-$DATE-corrected.json"; fi
          if [ "$MANUAL_FINAL" = "true" ]; then RECEIPT="social/published/$FORMAT-$DATE-full-week.json"; fi
          if [ "$MANUAL_DRY_RUN" != "true" ] && [ -f "$RECEIPT" ] && grep -q '"id"' "$RECEIPT"; then echo "::notice::Already published $FORMAT for $DATE; duplicate post blocked"; echo "SKIP_WEEKLY=1" >> "$GITHUB_ENV"; fi
          if [ "$FORMAT" = "weekend" ]; then COVER="social/weekly-assets/weekend-keyvisual (1).png"; elif [ "$FORMAT" = "women" ]; then COVER="social/weekly-assets/women-keyvisual.png"; else COVER="social/weekly-assets/free-tv-keyvisual.png"; fi
          if [ ! -f "$COVER" ]; then
            echo "::warning::Approved cover missing; publication safely skipped"
            echo "SKIP_WEEKLY=1" >> "$GITHUB_ENV"
          fi
      - name: Install Chromium
        if: env.SKIP_WEEKLY != '1'
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Validate and render carousel
        if: env.SKIP_WEEKLY != '1'
        run: WEEKLY_DRY_RUN=1 node scripts/social/publish-weekly.mjs
      - name: Commit carousel images
        if: env.SKIP_WEEKLY != '1' && env.WEEKLY_DRY_RUN != '1'
        run: |
          DATE=$(TZ=Europe/Berlin date +%F)
          mkdir -p social/weekly-generated
          N=0
          for F in social-output/weekly/*.jpg; do
            printf -v INDEX "%02d" "$N"
            cp "$F" "social/weekly-generated/$WEEKLY_FORMAT-$DATE${WEEKLY_ASSET_SUFFIX:-}-$INDEX.jpg"
            N=$((N+1))
          done
          git config user.name spieltag-aktuell-bot
          git config user.email actions@users.noreply.github.com
          git add social/weekly-generated
          git commit -m "Render weekly Instagram carousel for $DATE" || true
          # Rebase tracked npm changes without deleting node_modules or rendered images.
          git -c rebase.autoStash=true pull --rebase origin main
          git push origin HEAD:main
          echo "IG_ASSET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish Instagram carousel
        if: env.SKIP_WEEKLY != '1' && env.WEEKLY_DRY_RUN != '1'
        run: node scripts/social/publish-weekly.mjs
      - name: Save publication receipts
        if: always() && env.SKIP_WEEKLY != '1' && env.WEEKLY_DRY_RUN != '1'
        run: |
          git config user.name spieltag-aktuell-bot
          git config user.email actions@users.noreply.github.com
          git add social/published/
          if ! git diff --cached --quiet; then
            git commit -m "Record weekly Instagram publication"
            git -c rebase.autoStash=true pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload preview
        if: always() && env.SKIP_WEEKLY != '1'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-carousel-preview
          path: social-output/weekly/
          if-no-files-found: ignore
