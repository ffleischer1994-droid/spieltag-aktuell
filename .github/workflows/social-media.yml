name: Social Media Daily

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
    - cron: "17,37 6-8 * * *"
  workflow_dispatch:
    inputs:
      publish_mode:
        description: "Publish feed, story or both"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - feed
          - story

permissions:
  contents: write
  issues: write

concurrency:
  group: instagram-daily-publisher
  cancel-in-progress: false

jobs:
  instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh latest data and publication state
        run: git pull --ff-only origin main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Berlin morning window and daily receipts first
        run: |
          HOUR=$(TZ=Europe/Berlin date +%H)
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && { [ "$HOUR" -lt "08" ] || [ "$HOUR" -ge "11" ]; }; then
            echo "SKIP_SOCIAL=1" >> "$GITHUB_ENV"
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const date = new Intl.DateTimeFormat('en-CA', {timeZone:'Europe/Berlin', year:'numeric', month:'2-digit', day:'2-digit'}).format(new Date());
          const path = `social/published/${date}.json`;
          if (process.env.GITHUB_EVENT_NAME === 'schedule' && fs.existsSync(path)) {
            const state = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (state.feed?.id && state.story?.id) {
              fs.appendFileSync(process.env.GITHUB_ENV, 'SKIP_SOCIAL=1\n');
              console.log('Feed and story already published for', date);
            }
          }
          NODE

      - name: Maintain renewable Instagram authorization
        if: env.SKIP_SOCIAL != '1'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          node scripts/social/instagram-token.mjs
          git config user.name "spieltag-aktuell-bot"
          git config user.email "actions@users.noreply.github.com"
          git add social/auth/instagram-token.enc.json
          if ! git diff --cached --quiet; then
            git commit -m "Maintain encrypted Instagram authorization"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build social package
        if: env.SKIP_SOCIAL != '1'
        run: node scripts/social/build-social.mjs

      - name: Install renderer
        if: env.SKIP_SOCIAL != '1'
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Render feed and story
        if: env.SKIP_SOCIAL != '1'
        run: node scripts/social/render-social.mjs

      - name: Publish media URLs
        if: env.SKIP_SOCIAL != '1'
        run: |
          mkdir -p social
          cp social-output/feed.jpg social/latest-feed.jpg
          cp social-output/story.jpg social/latest-story.jpg
          git config user.name "spieltag-aktuell-bot"
          git config user.email "actions@users.noreply.github.com"
          git add social/latest-feed.jpg social/latest-story.jpg
          git commit -m "Update daily Instagram assets" || true
          git stash push --keep-index -m "social-render-temp" || true
          git pull --rebase origin main
          git push origin HEAD:main
          echo "IG_ASSET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Upload rendered preview
        if: env.SKIP_SOCIAL != '1'
        uses: actions/upload-artifact@v4
        with:
          name: instagram-preview
          path: |
            social-output/feed.png
            social-output/story.png
            social-output/caption.txt
            social-output/selection.json

      - name: Publish Instagram feed + story with retries
        if: env.SKIP_SOCIAL != '1'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_PUBLISH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_mode || 'both' }}
        run: |
          for ATTEMPT in 1 2 3; do
            echo "Instagram publish attempt $ATTEMPT/3"
            if node scripts/social/publish-instagram.mjs; then
              exit 0
            fi
            if [ "$ATTEMPT" -lt 3 ]; then
              sleep $((ATTEMPT * 45))
            fi
          done
          exit 1

      - name: Save publication receipts even after partial failure
        if: always() && env.SKIP_SOCIAL != '1'
        run: |
          if [ -d social/published ]; then
            git config user.name "spieltag-aktuell-bot"
            git config user.email "actions@users.noreply.github.com"
            git add social/published/
            if ! git diff --cached --quiet; then
              git commit -m "Record Instagram feed and story publication"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi

      - name: Open failure ticket
        if: failure() && env.SKIP_SOCIAL != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(TZ=Europe/Berlin date +%d.%m.%Y)
          TITLE="Instagram-Automation fehlgeschlagen: $DATE"
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BODY="Der automatische 08:00-Publisher ist nach den eingebauten Wiederholungsversuchen fehlgeschlagen.

          Run: $RUN_URL

          Veröffentlichungsempfang in social/published prüfen; erfolgreiche Feed-/Story-IDs werden beim nächsten Lauf nicht doppelt gepostet."
          NUMBER=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
