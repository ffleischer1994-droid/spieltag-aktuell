name: Social Media Daily

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      publish_mode:
        description: "Publish feed, story or both"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - feed
          - story

permissions:
  contents: write

jobs:
  instagram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run only at 08:00 Europe/Berlin
        run: |
          HOUR=$(TZ=Europe/Berlin date +%H)
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$HOUR" != "08" ]; then
            echo "SKIP_SOCIAL=1" >> "$GITHUB_ENV"
          fi
      - name: Build social package
        if: env.SKIP_SOCIAL != '1'
        run: node scripts/social/build-social.mjs
      - name: Install renderer
        if: env.SKIP_SOCIAL != '1'
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Render feed and story
        if: env.SKIP_SOCIAL != '1'
        run: node scripts/social/render-social.mjs
      - name: Publish media URLs
        if: env.SKIP_SOCIAL != '1'
        run: |
          mkdir -p social
          cp social-output/feed.png social/latest-feed.png
          cp social-output/story.png social/latest-story.png
          git config user.name "spieltag-aktuell-bot"
          git config user.email "actions@users.noreply.github.com"
          git add social/latest-feed.png social/latest-story.png
          git commit -m "Update daily Instagram assets" || true
          git pull --rebase origin main
          git push origin HEAD:main
          sleep 15
      - name: Upload rendered preview
        if: env.SKIP_SOCIAL != '1'
        uses: actions/upload-artifact@v4
        with:
          name: instagram-preview
          path: |
            social-output/feed.png
            social-output/story.png
            social-output/caption.txt
      - name: Publish Instagram feed + story
        if: env.SKIP_SOCIAL != '1'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_PUBLISH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_mode || 'both' }}
        run: node scripts/social/publish-instagram.mjs
