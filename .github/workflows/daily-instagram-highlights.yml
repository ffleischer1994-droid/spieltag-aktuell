name: Daily Instagram Highlights

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 4 * * *'

permissions:
  contents: write

concurrency:
  group: daily-instagram-highlights
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
      IG_USER_ID: "17841424388458822"
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stop duplicate DST run and select highlights
        id: select
        run: |
          hour=$(TZ=Europe/Berlin date +%H)
          if [ "$hour" != "05" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(TZ=Europe/Berlin date +%F)
          echo "date=$today" >> "$GITHUB_OUTPUT"
          if [ -f "instagram/published/$today.txt" ]; then
            echo "Already published"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node <<'NODE'
          const fs=require('fs');
          const games=JSON.parse(fs.readFileSync('games.json','utf8'));
          const d=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Berlin',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
          const german=/Deutschland|Bayern|Dortmund|Leverkusen|Frankfurt|Leipzig|Stuttgart|Freiburg|Mainz|Hoffenheim|Wolfsburg|Bremen|Hamburg|Köln|Gladbach|Schalke|Union Berlin|St\. Pauli|Augsburg|Heidenheim/i;
          const elite=/Champions League|Europa League|Conference League|Bundesliga|DFB-Pokal|Nations League|Länderspiel/i;
          const famous=/Barcelona|Real Madrid|Arsenal|Chelsea|Liverpool|Manchester|Paris Saint-Germain|Juventus|Inter Mailand|AC Mailand|Roma|Olympique Lyon/i;
          const score=g=>{
            let s=0;
            if(german.test(g.home+' '+g.away)) s+=100;
            if(/Deutschland/i.test(g.home+' '+g.away)) s+=80;
            if(elite.test(g.competition)) s+=40;
            if(famous.test(g.home+' '+g.away)) s+=20;
            if(g.country==='Deutschland') s+=15;
            if((g.groups||[]).includes('free')) s+=10;
            return s;
          };
          const selected=games.filter(g=>g.date===d).sort((a,b)=>score(b)-score(a)||a.time.localeCompare(b.time)).slice(0,4);
          if(!selected.length) process.exit(2);
          fs.writeFileSync('/tmp/highlights.json',JSON.stringify({date:d,games:selected}));
          NODE
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Install Playwright
        if: steps.select.outputs.run == 'true'
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Render daily image
        if: steps.select.outputs.run == 'true'
        run: |
          mkdir -p instagram/generated
          node <<'NODE'
          const {chromium}=require('playwright'),fs=require('fs'),path=require('path');
          const x=JSON.parse(fs.readFileSync('/tmp/highlights.json','utf8'));
          const months=['JANUAR','FEBRUAR','MÄRZ','APRIL','MAI','JUNI','JULI','AUGUST','SEPTEMBER','OKTOBER','NOVEMBER','DEZEMBER'];
          const [y,m,d]=x.date.split('-').map(Number);
          const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
          const rows=x.games.map((g,i)=>`<div class="match ${i?'':'first'}"><div class="time">${esc(g.time)}</div><div><div class="teams">${esc(g.home.replace(' ♀',''))} –<br>${esc(g.away.replace(' ♀',''))}</div><div class="sender">${esc((g.channels||[]).join(' · '))}</div></div></div>`).join('');
          const html=`<!doctype html><html><head><meta charset="utf-8"><style>@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Roboto:wght@400;500;700&display=swap');*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1350px;overflow:hidden;background:#F2AFC0;color:#000}body{font-family:Roboto,Arial,sans-serif}.post{width:1080px;height:1350px;padding:64px 82px 50px;display:flex;flex-direction:column}.logo{width:350px;height:auto;display:block;margin:0 auto}.middle{flex:1;display:flex;flex-direction:column;justify-content:center;padding-top:12px}.title{font-family:'Archivo Black','Arial Black',sans-serif;font-size:82px;line-height:.94;letter-spacing:-3px;margin:0 0 24px}.date{align-self:flex-start;background:#000;color:#F2AFC0;border-radius:999px;font-family:'Archivo Black','Arial Black',sans-serif;font-size:27px;padding:13px 23px 15px;margin-bottom:28px}.match{display:grid;grid-template-columns:130px 1fr;gap:20px;padding:20px 0 21px;border-bottom:3px solid #000}.match.first{border-top:3px solid #000}.time{font-family:'Archivo Black','Arial Black',sans-serif;font-size:36px}.teams{font-family:'Archivo Black','Arial Black',sans-serif;font-size:32px;line-height:1.02;letter-spacing:-1px}.sender{font-size:21px;font-weight:500;margin-top:7px}.footer{text-align:center;font-family:'Archivo Black','Arial Black',sans-serif;font-size:25px;padding-top:25px}</style></head><body><main class="post"><img class="logo" src="${path.resolve('logo.svg')}"><section class="middle"><h1 class="title">FUSSBALL-<br>HIGHLIGHTS<br>HEUTE</h1><div class="date">${d}. ${months[m-1]} ${y}</div>${rows}</section><footer class="footer">SPIELTAGAKTUELL.DE</footer></main></body></html>`;
          fs.writeFileSync('/tmp/post.html',html);
          (async()=>{const browser=await chromium.launch({headless:true});const page=await browser.newPage({viewport:{width:1080,height:1350}});await page.goto('file:///tmp/post.html',{waitUntil:'networkidle'});await page.evaluate(()=>document.fonts.ready);await page.screenshot({path:`instagram/generated/highlights-${x.date}.jpg`,type:'jpeg',quality:94});await browser.close()})()
          NODE

      - name: Commit image for public URL
        if: steps.select.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram/generated/
          git commit -m "Render daily Instagram highlights" || true
          git push
          sleep 35

      - name: Publish to Instagram
        if: steps.select.outputs.run == 'true'
        run: |
          today="${{ steps.select.outputs.date }}"
          image_url="https://spieltagaktuell.de/instagram/generated/highlights-$today.jpg"
          create=$(curl --fail-with-body -sS -X POST "https://graph.instagram.com/v26.0/${IG_USER_ID}/media" -H "Authorization: Bearer ${IG_ACCESS_TOKEN}" --data-urlencode "image_url=$image_url" --data-urlencode "caption=Fußball-Highlights heute – alle Spiele und Sender auf spieltagaktuell.de")
          id=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$create")
          for i in {1..8}; do
            status=$(curl -sS "https://graph.instagram.com/v26.0/$id?fields=status_code&access_token=${IG_ACCESS_TOKEN}" || true)
            echo "$status"
            if echo "$status" | grep -q '"FINISHED"'; then break; fi
            sleep 5
          done
          curl --fail-with-body -sS -X POST "https://graph.instagram.com/v26.0/${IG_USER_ID}/media_publish" -H "Authorization: Bearer ${IG_ACCESS_TOKEN}" --data-urlencode "creation_id=$id"

      - name: Mark date published
        if: steps.select.outputs.run == 'true'
        run: |
          today="${{ steps.select.outputs.date }}"
          mkdir -p instagram/published
          echo "published" > "instagram/published/$today.txt"
          git pull --rebase
          git add instagram/published/
          git commit -m "Mark Instagram highlights $today published" || true
          git push
