name: Data quality
on:
  push:
    paths:
      - "games.json"
      - "scripts/audit-data.py"
      - ".github/workflows/data-quality.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Deep data quality check
        run: python scripts/audit-data.py --report data-quality-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-quality-report
          path: data-quality-report.md
