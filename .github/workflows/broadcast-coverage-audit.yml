name: Broadcast coverage audit

on:
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * *'
    - cron: '15 3 * * *'

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@v4
      - name: Run only once at 04:15 Germany time
        id: guard
        run: |
          if [ "$(TZ=Europe/Berlin date +%H)" != "04" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - name: Validate broadcast dataset
        if: steps.guard.outputs.run == 'true'
        run: |
          python3 <<'PY'
          import json,datetime,sys
          games=json.load(open('games.json'))
          today=datetime.datetime.now().astimezone().date().isoformat()
          rows=[g for g in games if g.get('date')==today]
          errors=[]
          seen=set()
          for g in rows:
            key=(g.get('date'),g.get('time'),g.get('home'),g.get('away'))
            if key in seen: errors.append('duplicate: '+str(key))
            seen.add(key)
            if not g.get('channels'): errors.append('no channel: '+str(key))
            if any('unbekannt' in str(c).lower() for c in g.get('channels',[])):
              errors.append('unknown channel: '+str(key))
          print(f'{today}: {len(rows)} broadcast games')
          if errors:
            print('\n'.join(errors))
            sys.exit(1)
          if not rows:
            print('No German broadcast games loaded for today')
            sys.exit(1)
          PY
