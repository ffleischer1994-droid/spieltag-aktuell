name: Broadcast coverage audit

on:
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * *'
    - cron: '15 3 * * *'

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run only once at 04:15 Germany time
        id: guard
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$(TZ=Europe/Berlin date +%H)" != "04" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - name: Audit current 7-day broadcast dataset
        id: quality
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/audit-data.py --report data-quality-report.md
      - uses: actions/upload-artifact@v4
        if: always() && steps.guard.outputs.run == 'true'
        with:
          name: daily-broadcast-quality
          path: data-quality-report.md
      - name: Open or update issue on hard failure
        if: steps.guard.outputs.run == 'true' && steps.quality.outcome == 'failure'
        run: |
          TITLE="Datenqualität: $(TZ=Europe/Berlin date +%d.%m.%Y)"
          NUMBER=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body-file data-quality-report.md
          else
            gh issue create --title "$TITLE" --body-file data-quality-report.md --label "data-quality" ||             gh issue create --title "$TITLE" --body-file data-quality-report.md
          fi
      - name: Fail when hard errors were found
        if: steps.guard.outputs.run == 'true' && steps.quality.outcome == 'failure'
        run: exit 1
