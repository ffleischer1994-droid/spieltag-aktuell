name: Refresh and publish broadcast data
on:
  workflow_dispatch:
  push:
    paths:
      - games.json
      - scripts/refresh-games.py
      - .github/workflows/broadcast-data.yml
  schedule:
    - cron: '15 */4 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: website-publish
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      games_digest: ${{ steps.dataset.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install requests beautifulsoup4
      - name: Refresh all seven days from broadcast schedules
        if: github.event_name != 'push'
        run: python scripts/refresh-games.py
      - name: Validate data before publishing
        run: |
          python scripts/test-broadcast-channels.py
          python scripts/audit-data.py
      - name: Build and verify match pages with current broadcast data
        run: |
          python scripts/build-seo.py
          python scripts/sync-static-shell.py
          python scripts/check-seo.py
      - name: Save current broadcast dataset and match pages
        run: |
          git config user.name 'spieltag-aktuell-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add games.json ':(glob)**/*.html' sitemap.xml seo/matches.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh broadcast data and complete match pages'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Record exact dataset for public verification
        id: dataset
        shell: python
        run: |
          import hashlib, json, os
          data = json.load(open('games.json'))
          digest = hashlib.sha256(json.dumps(data, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('digest=' + digest + '\n')
      - name: Prepare website with current data
        run: |
          mkdir -p /tmp/broadcast-site
          git ls-files -z | tar --null -T - -cf - | tar -xf - -C /tmp/broadcast-site
      - uses: actions/upload-pages-artifact@v3
        with:
          name: broadcast-site
          path: /tmp/broadcast-site
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
        continue-on-error: true
        with:
          artifact_name: broadcast-site
          # Pages can remain deployment_queued for several minutes.
          timeout: 600000
      - name: Verify complete public dataset even after a Pages timeout
        env:
          EXPECTED_DIGEST: ${{ needs.refresh.outputs.games_digest }}
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
        shell: python
        run: |
          import collections, datetime, hashlib, json, os, time, urllib.request
          from zoneinfo import ZoneInfo
          expected = os.environ['EXPECTED_DIGEST']
          if not expected:
              raise SystemExit('Missing expected dataset digest')
          today = datetime.datetime.now(ZoneInfo('Europe/Berlin')).date()
          dates = [(today + datetime.timedelta(days=i)).isoformat() for i in range(7)]
          for attempt in range(12):
              try:
                  url = 'https://spieltagaktuell.de/games.json?verify=' + str(time.time_ns())
                  with urllib.request.urlopen(url, timeout=30) as response:
                      data = json.load(response)
                  actual = hashlib.sha256(json.dumps(data, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
                  counts = collections.Counter(game['date'] for game in data)
                  if actual == expected and all(counts[date] > 0 for date in dates):
                      print('Complete public dataset verified:', {date: counts[date] for date in dates})
                      if os.environ['DEPLOYMENT_OUTCOME'] != 'success':
                          print('::warning::Pages reported a failure, but the exact complete dataset is publicly delivered.')
                      break
              except Exception as exc:
                  print('Verification retry:', exc)
              if attempt == 11:
                  raise SystemExit('Complete public data does not match the generated dataset after deployment')
              time.sleep(10)
